name: DemoMessagingFeatureDemo
options:
  bundleIdPrefix: com.kahnli
  deploymentTarget:
    iOS: "16.0"
packages:
  LYStackRouter:
    path: ../../../..
  DemoMessagingFeature:
    path: ..
  DemoRouteContract:
    path: ../../DemoRouteContract
  DemoUIKit:
    path: ../../DemoUIKit
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  DemoMessagingFeatureDemo:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: DemoMessagingFeature
      - package: DemoRouteContract
      - package: DemoUIKit
      - package: LYStackRouter
        product: LYStackRouter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kahnli.DemoMessagingFeatureDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  DemoMessagingFeatureDemoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [../Tests]
    dependencies:
      - target: DemoMessagingFeatureDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  DemoMessagingFeatureDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources: [UITests]
    dependencies:
      - target: DemoMessagingFeatureDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DemoMessagingFeatureDemo:
    build:
      targets:
        DemoMessagingFeatureDemo: all
    test:
      targets: [DemoMessagingFeatureDemoTests, DemoMessagingFeatureDemoUITests]
